name: inqvine_core_main
description: Useful functionality, widgets, and more shared between all Inqvine products
version: 2.1.3+1
homepage: https://github.com/inqvine-llc

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  hooks_riverpod: ^2.3.7
  flutter_hooks: ^0.21.2
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  get_it: ^8.0.3
  event_bus: ^2.0.1

  # Data Classes
  protobuf: ^4.1.0
  fixnum: ^1.1.1

  # Tooling
  jiffy: ^6.4.3
  crypto: ^3.0.6
  universal_io: ^2.0.4

  # Debugging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  mockito: ^5.4.6
  build_runner: ^2.4.15
  import_sorter: ^4.6.0
